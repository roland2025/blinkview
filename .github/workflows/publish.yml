# Builds the sdist + wheel, smoke-tests the wheel on every supported Python, then publishes with
# PyPI Trusted Publishing (OIDC - no API token stored in the repo).
#
# - Pushing a v* tag (scripts/release.py does) publishes to PyPI.
# - Run it manually from the Actions tab to publish the current ref to TestPyPI (or PyPI).
#
# One-time setup on pypi.org / test.pypi.org: add a trusted publisher for this repo with
# workflow "publish.yml" and environment "pypi" / "testpypi" respectively.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/blinkview/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5  # for scripts/import_smoke.py only; the code under test is the wheel

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the wheel as a uv tool
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uv tool install "${wheel}[all]" --python ${{ matrix.python }}
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: CLI runs
        shell: bash
        run: |
          blink --version
          blink export --help > /dev/null

      - name: Every module imports
        shell: bash
        run: |
          py="$(uv tool dir)/blinkview/$([ "$RUNNER_OS" = Windows ] && echo Scripts/python.exe || echo bin/python)"
          "$py" scripts/import_smoke.py

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.index || 'pypi' }}
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
