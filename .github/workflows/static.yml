# Simple workflow for deploying static content to GitHub Pages
name: Deploy README.md to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # Fixed Node deprecation warning

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Convert README to Index HTML
        run: |
          mkdir public
          
          # 1. Create your custom stylesheet (Handles dark mode and image sizing)
          cat << 'EOF' > public/custom.css
          img { 
            max-width: 100%; 
            height: auto;     
            display: block;    
            margin: 1em auto;
          }
          html {
            color: #e0e0e0;
            background-color: #0d1117; 
            color-scheme: dark;       
          }
          a, a:visited { color: #58a6ff; }
          pre {
            background-color: #161b22;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid #30363d;
            overflow: auto;
          }
          body {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            line-height: 1.6;
          }
          EOF

          # 2. Compile the Markdown to standalone HTML using Pandoc
          pandoc README.md -s -c custom.css -o public/index.html --metadata

          # 3. Inject the Mermaid JS Engine right before the closing </body> tag
          # This automatically finds `<pre class="mermaid">` blocks and draws them dynamically!
          sed -i 's|</body>|<script type="module">import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs"; mermaid.initialize({ startOnLoad: true, theme: "dark" });</script></body>|' public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Point to the generated HTML folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
