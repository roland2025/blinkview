# Simple workflow for deploying static content to GitHub Pages
name: Deploy README.md to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # Fixed Node deprecation warning

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Convert README to Index HTML
        run: |
          mkdir public
          # Converts README and outputs it as the required index.html
          pandoc README.md -s -o public/index.html --metadata title="BlinkView Documentation"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Point to the generated HTML folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
