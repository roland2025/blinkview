# Simple workflow for deploying static content to GitHub Pages
name: Deploy README.md to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # Fixed Node deprecation warning

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Convert README to Index HTML
        run: |
          mkdir public
          
          # Assemble a layout block that respects system dark/light targets natively
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BlinkView Documentation</title>' > public/index.html
          echo '<style>body{max-width:800px;margin:40px auto;padding:0 10px;font-family:sans-serif;line-height:1.6;color:#333;background:#fff;} pre{background:#f4f4f4;padding:15px;overflow:auto;} code{font-family:monospace;} @media (prefers-color-scheme: dark) { body{color:#f0f6fc;background:#0d1117;} pre{background:#161b22;} a{color:#58a6ff;} }</style></head><body>' >> public/index.html
          
          # Append the parsed markdown body
          pandoc README.md -t html >> public/index.html
          
          echo '</body></html>' >> public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Point to the generated HTML folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
