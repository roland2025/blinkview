# Simple workflow for deploying static content to GitHub Pages
name: Deploy README.md to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # Fixed Node deprecation warning

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Convert README to Index HTML
        run: |
          mkdir public
          
          # 1. Create the fixed custom style sheet (Fixes dark mode and large images)
          cat << 'EOF' > public/custom.css
          /* The absolute critical fix for your images: */
          img { 
            max-width: 100%; /* Image is constrained to parent width */
            height: auto;     /* Aspect ratio is maintained */
            display: block;    /* Centers and structures image blocks */
            margin: 1em auto;
          }

          /* General styling (fixes the previous light theme issue) */
          html {
            color: #e0e0e0;
            background-color: #0d1117; /* GitHub Dark-mode gray */
            color-scheme: dark;       /* Helps render native elements natively dark */
          }
          a, a:visited {
            color: #58a6ff;
          }
          blockquote {
            border-left: 2px solid #30363d;
            color: #8b949e;
          }
          code {
            background-color: rgba(110, 118, 129, 0.4);
            padding: 0.2em 0.4em;
            border-radius: 6px;
          }
          pre {
            background-color: #161b22;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid #30363d;
          }
          /* Ensure the content is centered and readable on wide screens */
          body {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px;
            line-height: 1.6;
          }
          @media (max-width: 600px) {
            body { padding: 15px; }
          }
          EOF

          # 2. Run Pandoc conversion using the custom stylesheet
          # Note: The custom CSS will override the conflicting Pandoc default rules.
          pandoc README.md -s -c custom.css -o public/index.html --metadata title="BlinkView Documentation"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # Point to the generated HTML folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
